<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Project "Implementing Phonetic Mistakes with a TTS-STT-Pipeline"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Audio Sample Input for the Project <br>"Implementing Phonetic Mistakes with a TTS-STT-Pipeline"</h1>
  <p>Hello and thank you for helping with this project!</p>
  <form id="nameForm">
    <div class="participantDetails">
      <label for="participantName">Your name:</label>
      <input id="participantName" name="participantName" type="text" required maxlength="100" autocomplete="name">
      <label for="nativeLanguage">Native language:</label>
      <input id="nativeLanguage" name="nativeLanguage" type="text" required maxlength="100" autocomplete="language">
      <label for="countryOfOrigin">Country of Origin:</label>
      <input id="countryOfOrigin" name="countryOfOrigin" type="text" required maxlength="100" autocomplete="country-name">
      <label for="participantAge">Age:</label>
      <input id="participantAge" name="participantAge" type="number" required min="1" max="120" inputmode="numeric">
      <label for="englishKnowledge">Knowledge of English:</label>
      <select id="englishKnowledge" name="englishKnowledge" required>
        <option value="" selected disabled>Select CEFR level</option>
        <option value="A1">A1: Beginner</option>
        <option value="A2">A2: Elementary</option>
        <option value="B1">B1: Intermediate</option>
        <option value="B2">B2: Upper Intermediate</option>
        <option value="C1">C1: Advanced</option>
        <option value="C2">C2: Proficient</option>
      </select>
    </div>
    <button id="nameSubmit" type="submit" disabled>Submit</button>
    <p id="nameStatus" role="status" aria-live="polite"></p>
  </form>
  <p>Here you can <a id="activityLink" href="input_audio.html" aria-disabled="true">input audio samples</a> for data snippets <br>
    You can input as many audio samples as you want and can continue in a new session at any point. 
  </p>

  <script src="index.js?v=2"></script>

</body>
</html>
